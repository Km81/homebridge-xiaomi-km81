name: Publish to npm

# 두 가지 트리거:
#   1. workflow_dispatch  : 수동 실행. patch/minor/major 중 선택 → npm version 으로
#      커밋·태그를 만들고 npm publish.
#   2. push tag v*        : 누군가 로컬에서 `npm version` 후 tag를 push 한 경우에도
#      자동 publish. (수동 실행에서 만들어진 tag도 여기에 걸려 다시 돌지 않도록
#      job 안에서 dispatch 결과를 우선 처리한다.)
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: '버전 증가 유형'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 버전 커밋과 태그 push 권한
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git (for version bump commit)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version & create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ github.event.inputs.version_type }} -m "chore(release): %s"
          git push --follow-tags origin HEAD

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show published version
        run: |
          PUBLISHED_VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=Published::homebridge-xiaomi-km81@${PUBLISHED_VERSION} to npm"
